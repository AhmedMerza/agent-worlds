name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux git
      - run: git config --global user.name ci && git config --global user.email ci@example.com && git config --global init.defaultBranch main
      - run: npm --prefix server ci
      - run: npm --prefix web ci # the Update now tests build the web app for real
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
